run_name: _smoke_dormant_cnn

env_id: MiniWorld-OneRoom-v0
seed: 0
n_envs: 4
use_subproc: false

encoder: cnn
encoder_kwargs:
  features_dim: 512

total_timesteps: 4096
checkpoint_steps: [4096]

learning_rate: 0.0003
n_steps: 256
batch_size: 256
n_epochs: 10
gamma: 0.99

# Small + frequent so a short run produces several measurements to eyeball.
dormant_ratio:
  enabled: true
  log_freq: 1024
  n_reference_obs: 128
  reference_seed: 12345
  batch_size: 64
  taus: [0.0, 0.025, 0.1]
